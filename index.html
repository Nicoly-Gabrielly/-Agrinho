<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DroneVision • IA Aérea</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
        
        body {
            font-family: 'Inter', system_ui, sans-serif;
        }
        .title-font {
            font-family: 'Space Grotesk', sans-serif;
        }

        .hero-bg {
            background: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.85)), 
                        url('https://picsum.photos/id/1015/2000/1200') center/cover no-repeat;
        }

        .drone-float {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-30px); }
        }

        .mobile-menu {
            transform: translateX(100%);
            transition: transform 0.4s ease-in-out;
        }
        
        .mobile-menu.active {
            transform: translateX(0);
        }
    </style>
</head>
<body class="bg-zinc-950 text-white overflow-x-hidden">
    <!-- NAVBAR -->
    <nav class="fixed top-0 w-full z-50 bg-zinc-950/90 backdrop-blur-lg border-b border-white/10">
        <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-cyan-500 rounded-xl flex items-center justify-center text-black font-bold text-2xl rotate-12">✦</div>
                <h1 class="title-font text-3xl font-bold tracking-tighter">DroneVision</h1>
            </div>
            
            <!-- Desktop Menu -->
            <div class="hidden md:flex items-center gap-8 text-sm font-medium">
                <a href="#home" class="hover:text-cyan-400 transition-colors">Início</a>
                <a href="#recursos" class="hover:text-cyan-400 transition-colors">Recursos</a>
                <a href="#tecnologia" class="hover:text-cyan-400 transition-colors">Tecnologia</a>
                <a href="#demo" class="hover:text-cyan-400 transition-colors">Demo IA</a>
                <a href="#galeria" class="hover:text-cyan-400 transition-colors">Galeria</a>
            </div>
            
            <div class="flex items-center gap-4">
                <button onclick="contactClick()" 
                        class="hidden md:block px-6 py-3 bg-white text-black rounded-2xl font-semibold hover:bg-cyan-400 transition-all">
                    Contato
                </button>
                
                <!-- Hamburger Button -->
                <button id="hamburger" class="md:hidden text-3xl focus:outline-none">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>
        </div>

        <!-- Mobile Menu -->
        <div id="mobileMenu" class="mobile-menu fixed top-0 right-0 h-full w-72 bg-zinc-900 border-l border-white/10 shadow-2xl md:hidden">
            <div class="p-6">
                <div class="flex justify-between items-center mb-10">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 bg-cyan-500 rounded-xl flex items-center justify-center text-black font-bold">✦</div>
                        <span class="title-font text-2xl font-bold">DroneVision</span>
                    </div>
                    <button id="closeMenu" class="text-3xl">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                
                <div class="flex flex-col gap-6 text-lg">
                    <a href="#home" onclick="closeMobileMenu()" class="hover:text-cyan-400 transition-colors">Início</a>
                    <a href="#recursos" onclick="closeMobileMenu()" class="hover:text-cyan-400 transition-colors">Recursos</a>
                    <a href="#tecnologia" onclick="closeMobileMenu()" class="hover:text-cyan-400 transition-colors">Tecnologia</a>
                    <a href="#demo" onclick="closeMobileMenu()" class="hover:text-cyan-400 transition-colors">Demo IA</a>
                    <a href="#galeria" onclick="closeMobileMenu()" class="hover:text-cyan-400 transition-colors">Galeria</a>
                </div>
                
                <div class="mt-12">
                    <button onclick="contactClick(); closeMobileMenu()" 
                            class="w-full py-4 bg-cyan-500 text-black font-semibold rounded-2xl">
                        Entrar em Contato
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- O resto do seu site continua igual (Hero, Recursos, Demo, etc.) -->
    <!-- ... (mantive o resto do código igual para não ficar gigante) ... -->

    <!-- HERO (mesmo de antes) -->
    <section id="home" class="hero-bg min-h-screen flex items-center pt-20">
        <!-- conteúdo do hero permanece o mesmo -->
        <div class="max-w-7xl mx-auto px-6 grid md:grid-cols-2 gap-12 items-center">
            <div class="space-y-8">
                <div class="inline-flex items-center gap-2 bg-white/10 backdrop-blur-md px-5 py-2 rounded-3xl text-sm border border-white/20">
                    <div class="w-3 h-3 bg-green-400 rounded-full animate-pulse"></div>
                    IA EM TEMPO REAL
                </div>
                
                <h1 class="title-font text-7xl md:text-8xl font-bold leading-none tracking-tighter">
                    VISÃO QUE<br>
                    <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">VOA</span>
                </h1>
                
                <p class="text-xl text-zinc-300 max-w-lg">
                    Drones inteligentes com visão computacional avançada. 
                    Detecção, rastreamento e análise em tempo real.
                </p>
                
                <div class="flex gap-4">
                    <button onclick="document.getElementById('demo').scrollIntoView({ behavior: 'smooth' })" 
                            class="px-8 py-4 bg-cyan-500 hover:bg-cyan-400 text-black font-semibold rounded-2xl text-lg transition-all">
                        TESTAR DEMO
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- O restante das seções (recursos, demo, tecnologia, galeria e footer) permanecem iguais -->

    <script>
        // Hamburger Menu Logic
        const hamburger = document.getElementById('hamburger');
        const mobileMenu = document.getElementById('mobileMenu');
        const closeMenu = document.getElementById('closeMenu');

        hamburger.addEventListener('click', () => {
            mobileMenu.classList.add('active');
        });

        closeMenu.addEventListener('click', () => {
            mobileMenu.classList.remove('active');
        });

        // Close menu when clicking on links
        function closeMobileMenu() {
            mobileMenu.classList.remove('active');
        }

        // Close menu if user clicks outside
        document.addEventListener('click', (e) => {
            if (!mobileMenu.contains(e.target) && !hamburger.contains(e.target)) {
                mobileMenu.classList.remove('active');
            }
        });

        // Smooth scroll
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function(e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) target.scrollIntoView({ behavior: 'smooth' });
            });
        });

        function contactClick() {
            alert("🚁 Obrigado pelo interesse!\n\nEm um projeto real, este botão abriria um formulário de contato.");
        }

        console.log('%cDroneVision com Menu Hamburger carregado!', 'color: #00f5ff; font-family: monospace');
    </script>
</body>
</html>
